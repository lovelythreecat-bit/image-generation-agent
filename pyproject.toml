[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-agent"
version = "0.2.0"
description = "Standalone multi-image product creation and evidence auditing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fonttools>=4.60,<5",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "Pillow>=12.3,<13",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "build", "hatchling", "aiosqlite>=0.20,<1"]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncmy>=0.2,<1",
    "alembic>=1.13,<2",
    "cryptography>=43,<48",
    "python-multipart>=0.0.18,<1",
]

[project.scripts]
image-agent = "image_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
