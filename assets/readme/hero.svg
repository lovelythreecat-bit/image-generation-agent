      <text x="64" y="65">商品素材 / 创作 / 审核</text>
    </g>
    <g id="title-block" fill="#25241F">
      <text x="59" y="168" font-size="92" font-weight="700" letter-spacing="-3">image-agent</text>
      <text x="64" y="247" font-size="43" font-weight="600">从真实商品素材，开始电商图片创作。</text>
    </g>
    <text x="65" y="302" fill="#726A5E" font-size="22">Windows 工作台 · CLI · Python API</text>
  </g>
