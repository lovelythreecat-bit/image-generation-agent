[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-agent"
version = "0.1.0"
description = "Standalone multi-image product creation and evidence auditing"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "Pillow>=12.3,<13"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "build", "hatchling"]

[project.scripts]
image-agent = "image_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
