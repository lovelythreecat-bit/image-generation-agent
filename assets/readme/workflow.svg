<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img" aria-labelledby="title desc">
  <title id="title">商品图片创作流程</title>
  <desc id="desc">01 添加素材，02 分析与选择，03 生成图片，04 审核与保存。若有澄清问题，先选择方案或补充素材再生成。</desc>
  <rect width="1200" height="208" rx="20" fill="#FBF8F2"/>
  <path d="M87 63H1113" stroke="#E5DFD5" stroke-width="2"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <g id="material-input" transform="translate(62 0)">
      <circle cx="25" cy="63" r="25" fill="#EC6B35"/>
      <text x="25" y="71" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="600">01</text>
      <text x="0" y="139" fill="#25241F" font-size="39" font-weight="600">添加素材</text>
    </g>
    <g id="material-analysis" transform="translate(341 0)">
      <circle cx="25" cy="63" r="25" fill="#FBF8F2" stroke="#E5DFD5" stroke-width="2"/>
      <text x="25" y="71" text-anchor="middle" fill="#726A5E" font-size="22" font-weight="600">02</text>
      <text x="0" y="139" fill="#25241F" font-size="39" font-weight="600">分析选择</text>
    </g>
    <g id="image-generation" transform="translate(620 0)">
      <circle cx="25" cy="63" r="25" fill="#FBF8F2" stroke="#E5DFD5" stroke-width="2"/>
      <text x="25" y="71" text-anchor="middle" fill="#726A5E" font-size="22" font-weight="600">03</text>
      <text x="0" y="139" fill="#25241F" font-size="39" font-weight="600">生成图片</text>
    </g>
    <g id="audit-and-save" transform="translate(899 0)">
      <circle cx="25" cy="63" r="25" fill="#FBF8F2" stroke="#E5DFD5" stroke-width="2"/>
      <text x="25" y="71" text-anchor="middle" fill="#726A5E" font-size="22" font-weight="600">04</text>
      <text x="0" y="139" fill="#25241F" font-size="39" font-weight="600">审核保存</text>
    </g>
  </g>
</svg>
